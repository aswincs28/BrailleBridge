<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrailleBridge – Braille to Text AI</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(to bottom right, #0f172a, #0c4a6e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            width: 450px;
            padding: 35px 30px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0px 0px 25px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.7s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 30px;
        }

        .subtitle {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 30px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            border: none;
            color: black;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .output-box {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>BrailleBridge</h1>
        <p class="subtitle">AI-powered Braille to Text Conversion</p>

        <form action="/" method="POST" enctype="multipart/form-data">
            <label for="image" class="upload-box">
                <strong>Click to Upload Braille Image</strong>
                <br><br>
                <span style="font-size: 12px; opacity: .7;">PNG / JPG supported</span>
            </label>
            <input type="file" name="image" id="image" required>

            <button class="btn">Convert to Text</button>
        </form>

        {% if text %}
        <div class="output-box">
            <strong>Recognized Braille Text:</strong>
            <br><br>
            {{ text }}
        </div>
        {% endif %}
    </div>

</body>
</html>
